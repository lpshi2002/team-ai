project_id: team-ai-workspace
scope: workspace:team-ai

harness:
  required_version: ">=0.1.0"
  mode: workspace_root

default_write_scope: workspace:team-ai

imports:
  - scope: org:jo
    path: shared/packs/org-jo
    required: false
  - scope: program:finance-ai-ideation
    path: shared/packs/finance-ai-ideation
    required: true
  - scope: harness:team-ai
    path: shared/packs/harness-team-ai
    required: false

scope_modes:
  normal:
    include:
      - workspace:team-ai
      - org:jo
      - program:finance-ai-ideation
  implementation:
    include:
      - workspace:team-ai
      - org:jo
      - program:finance-ai-ideation
  harness:
    include:
      - org:jo
      - harness:team-ai
  compare_projects:
    require_explicit_user_intent: true

source_scope_rules:
  - path: .team-ai/project.yaml
    scope: workspace:team-ai
  - path: .team-ai/state.yaml
    scope: workspace:team-ai
  - path: shared/packs/finance-ai-ideation/**
    scope: program:finance-ai-ideation
  - path: shared/packs/harness-team-ai/**
    scope: harness:team-ai
  - path: shared/packs/org-jo/**
    scope: org:jo
